<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
</head>
<body>
  <p style="font-family:system-ui;text-align:center;margin-top:20vh">Loading…</p>
  <script>
  (function () {
    var original = location.pathname + location.search + location.hash;
    var match = original.match(/^(.*?)(?:\/watch\/\d+(?:\/[^?#]*)?)(?:[?#].*)?$/);
    var base = match ? match[1] : '';
    sessionStorage.setItem('github_pages_original_path', original);
    location.replace(base + '/?github_pages_route=1');
  })();
  </script>
</body>
</html>
